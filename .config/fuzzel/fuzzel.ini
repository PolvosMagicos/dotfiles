[main]
font=JetBrainsMono Nerd Font:size=13
dpi-aware=yes
terminal=kitty

prompt="❯ "
placeholder=Search apps...
icons-enabled=yes
icon-theme=hicolor
fields=name,generic,comment,categories,filename

lines=12
width=45
horizontal-pad=28
vertical-pad=14
inner-pad=8
image-size-ratio=0.5

layer=overlay
exit-on-keyboard-focus-loss=yes
show-actions=yes

[colors]
background=1e1e2eee
text=cdd6f4ff
match=f9e2afff
selection=313244ff
selection-text=cdd6f4ff
selection-match=f9e2afff
border=89b4faff

[border]
width=2
radius=12
